[package]
name = "plato-normalize"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Normalization and standardization for PLATO tile values"

[dependencies]
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
serde_json = "1.0.150"
